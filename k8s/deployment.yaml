apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradeapi
  namespace: tradeapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tradeapi
  template:
    metadata:
      labels:
        app: tradeapi
    spec:
      containers:
        - name: tradeapi
          image: 513774291220.dkr.ecr.us-east-1.amazonaws.com/eks-observability-app:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 30
          envFrom:
            - secretRef:
                name: tradeapi-secrets